name: Build one verified PIRA tool bundle

on:
  workflow_call:
    inputs:
      tool:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.tool }} bundle
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TOOL: ${{ inputs.tool }}
      BUILD_SCRIPT: tools/build/build_${{ inputs.tool }}_platform_bins.py
      NEEDS_ZIG: ${{ inputs.tool == 'pira_nav' }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tool selection
        shell: bash
        run: |
          case "${TOOL}" in
            pira_ctx|pira_dec|pira_nav|pira_svg_check|pira_team|pira_write_check) ;;
            *) echo "Unknown release tool" >&2; exit 1 ;;
          esac

      - name: Check source and tests
        run: |
          # Use physical fixture paths; Nav intentionally rejects symlink ancestors.
          export TMPDIR="$(python3 -c 'import os, tempfile; print(os.path.realpath(tempfile.gettempdir()))')"
          python3 -m unittest \
            assets.scripts.test_setup_pira \
            assets.scripts.test_setup_pira_tools \
            assets.scripts.test_setup_pira_communication \
            assets.scripts.test_setup_pira_claude \
            assets.scripts.test_python_bootstrap \
            tools.dev.pira_write_check.test_benchmark \
            assets.scripts.test_retire_pira_audio \
            tools.build.test_build_pira_ctx_platform_bins \
            tools.build.test_package_github_release \
            tools.build.test_mixed_release \
            tools.build.test_release_plan
          cargo fmt --manifest-path tools/Cargo.toml --package "${TOOL}" -- --check
          # The copied/unlinked live-executable fixture is prohibited on macOS.
          test_args=()
          if [[ "${TOOL}" == "pira_team" ]]; then
            echo "SKIPPED: macOS unlinked live executable fixture (known kernel-held process risk)."
            # Parallel forks can retain other tests' owner locks; serialize Team.
            test_args=(-- --test-threads=1 --skip unlinked_live_executable_never_becomes_missing_worker_or_exited_backend)
          fi
          cargo test --manifest-path tools/Cargo.toml --locked --package "${TOOL}" "${test_args[@]}"
          if [[ "${TOOL}" == "pira_team" ]]; then
            cargo build --manifest-path tools/Cargo.toml --locked --package pira_team --package pira_dec
            PIRA_TEAM_BIN="$PWD/tools/target/debug/pira_team" PIRA_DEC_BIN="$PWD/tools/target/debug/pira_dec" TEAM_TEST_SLOW_PREFLIGHT=1 PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tools/crates/pira_team/tests -p 'test_*.py' -v
          fi

      - name: Install Windows cross-linker
        run: |
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null; then
            brew install mingw-w64
          fi
          x86_64-w64-mingw32-gcc --version | head -1

      - name: Build every platform twice
        shell: bash
        run: |
          set -euo pipefail
          args=(--bootstrap-rustup)
          if [[ "${NEEDS_ZIG}" == "true" ]]; then
            args+=(--bootstrap-zig)
          fi
          python3 "${BUILD_SCRIPT}" "${args[@]}"

      - name: Package verified bundle
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(TOOL="${TOOL}" python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tool = os.environ["TOOL"]
          manifest = tomllib.loads(Path(f"tools/crates/{tool}/Cargo.toml").read_text())
          print(manifest["package"]["version"])
          PY
          )"
          archive="${TOOL}-${version}-bundle.tar.gz"
          tar -czf "${archive}" -C tools/dist "${TOOL}"
          shasum -a 256 "${archive}" > "${archive}.sha256"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload complete bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.tool }}-${{ steps.package.outputs.version }}-bundle
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
