name: Test PIRA setup

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Setup tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run installer tests
        run: >-
          ${{ matrix.python }} -m unittest -q
          assets.scripts.test_setup_pira
          assets.scripts.test_setup_pira_tools
          assets.scripts.test_setup_pira_claude
