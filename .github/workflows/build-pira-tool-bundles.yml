name: Build PIRA tool bundles

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pira-tool-bundles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize release build
    runs-on: ubuntu-latest
    steps:
      - name: Require owner dispatch from master
        env:
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${ACTOR}" == "AlgebraLoveme" ]] || {
            echo "Only AlgebraLoveme may publish a PIRA tools release." >&2
            exit 1
          }
          [[ "${REF}" == "refs/heads/master" ]] || {
            echo "Run this workflow from the master branch, not ${REF}." >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.tool }} bundle
    needs: authorize
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: pira_ctx
            script: tools/build/build_pira_ctx_platform_bins.py
            needs_zig: false
          - tool: pira_dec
            script: tools/build/build_pira_dec_platform_bins.py
            needs_zig: false
          - tool: pira_nav
            script: tools/build/build_pira_nav_platform_bins.py
            needs_zig: true
          - tool: pira_svg_check
            script: tools/build/build_pira_svg_check_platform_bins.py
            needs_zig: false

    env:
      TOOL: ${{ matrix.tool }}
      BUILD_SCRIPT: ${{ matrix.script }}
      NEEDS_ZIG: ${{ matrix.needs_zig }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check source and tests
        run: |
          python3 -m unittest \
            assets.scripts.test_setup_pira_tools \
            tools.build.test_build_pira_ctx_platform_bins \
            tools.build.test_package_github_release
          cargo fmt --manifest-path tools/Cargo.toml --package "${TOOL}" -- --check
          cargo test --manifest-path tools/Cargo.toml --locked --package "${TOOL}"

      - name: Install Windows cross-linker
        run: |
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null; then
            brew install mingw-w64
          fi
          x86_64-w64-mingw32-gcc --version | head -1

      - name: Build every platform twice
        shell: bash
        run: |
          set -euo pipefail
          args=(--bootstrap-rustup)
          if [[ "${NEEDS_ZIG}" == "true" ]]; then
            args+=(--bootstrap-zig)
          fi
          python3 "${BUILD_SCRIPT}" "${args[@]}"

      - name: Package verified bundle
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(TOOL="${TOOL}" python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tool = os.environ["TOOL"]
          manifest = tomllib.loads(Path(f"tools/crates/{tool}/Cargo.toml").read_text())
          print(manifest["package"]["version"])
          PY
          )"
          archive="${TOOL}-${version}-bundle.tar.gz"
          tar -czf "${archive}" -C tools/dist "${TOOL}"
          shasum -a 256 "${archive}" > "${archive}.sha256"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload complete bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.tool }}-${{ steps.package.outputs.version }}-bundle
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  test-windows:
    name: Test native Windows behavior
    needs: authorize
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run native Windows tests
        run: |
          python -m unittest `
            assets.scripts.test_setup_pira_tools `
            tools.build.test_build_pira_ctx_platform_bins `
            tools.build.test_package_github_release
          cargo test --manifest-path tools/Cargo.toml --workspace --locked

  publish:
    name: Publish GitHub Release
    needs: [build, test-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release packaging code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-bundle"
          path: ${{ runner.temp }}/pira-build-artifacts

      - name: Prepare compressed release assets
        id: release
        shell: bash
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/pira-build-artifacts
          ASSETS_DIR: ${{ runner.temp }}/pira-release-assets
        run: |
          set -euo pipefail
          tag="pira-tools-r${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          python3 tools/build/package_github_release.py \
            --artifacts-dir "${ARTIFACTS_DIR}" \
            --output-dir "${ASSETS_DIR}" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${tag}" \
            --source-sha "${GITHUB_SHA}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish immutable-versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSETS_DIR: ${{ runner.temp }}/pira-release-assets
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            draft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
            [[ "${draft}" == "true" ]] || {
              echo "Refusing to replace existing published release ${TAG}." >&2
              exit 1
            }
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title "PIRA tools ${TAG#pira-tools-}" \
              --notes "Cloud-built PIRA tool binaries from ${GITHUB_SHA}."
          fi
          gh release upload "${TAG}" "${ASSETS_DIR}"/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          gh release edit "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest
