name: Build PIRA tool bundles

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Full ancestor source SHA for changed-first ordering; blank or uncertain validates all first
        type: string
        default: ""
        required: false
      retained_tools:
        description: 'Optional JSON tool pins: {"TOOL":{"tag":"pira-tools-...","version":"...","source_sha":"FULL_BUILD_SHA"}}; other tools build fresh'
        type: string
        default: "{}"
        required: false
      first_tools:
        description: 'Optional JSON list of fresh tools to finish before other fresh builds; empty preserves automatic ordering'
        type: string
        default: "[]"
        required: false
      publish_release:
        description: Publish publicly only after required acceptance results are approved
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: pira-tool-bundles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize release build
    runs-on: ubuntu-latest
    outputs:
      has_changed: ${{ steps.plan.outputs.has_changed }}
      has_remaining: ${{ steps.plan.outputs.has_remaining }}
      changed_matrix: ${{ steps.plan.outputs.changed_matrix }}
      remaining_matrix: ${{ steps.plan.outputs.remaining_matrix }}
      retained_tools: ${{ steps.plan.outputs.retained_tools }}
      build_tools: ${{ steps.plan.outputs.build_tools }}
    steps:
      - name: Require owner dispatch from master
        env:
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${ACTOR}" == "AlgebraLoveme" ]] || {
            echo "Only AlgebraLoveme may publish a PIRA tools release." >&2
            exit 1
          }
          [[ "${REF}" == "refs/heads/master" ]] || {
            echo "Run this workflow from the master branch, not ${REF}." >&2
            exit 1
          }

      - name: Check out source and local baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Linux setup compatibility
        run: |
          python3 -B -m unittest \
            assets.scripts.test_setup_pira \
            assets.scripts.test_setup_pira_tools \
            assets.scripts.test_setup_pira_communication \
            assets.scripts.test_setup_pira_claude \
            assets.scripts.test_python_bootstrap \
            tools.build.test_mixed_release

      - name: Plan changed-first fresh builds
        id: plan
        env:
          BASE_SHA: ${{ inputs.baseline_sha }}
          RETAINED_TOOLS: ${{ inputs.retained_tools }}
          FIRST_TOOLS: ${{ inputs.first_tools }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -m tools.build.release_plan --base "${BASE_SHA}" --first-tools "${FIRST_TOOLS}" --retained-tools "${RETAINED_TOOLS}" --repository "${GITHUB_REPOSITORY}" --github-output "${GITHUB_OUTPUT}"

  build_changed:
    name: Validate changed ${{ matrix.tool }} first
    needs: authorize
    if: ${{ needs.authorize.outputs.has_changed == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.authorize.outputs.changed_matrix) }}
    uses: ./.github/workflows/build-pira-tool-bundle.yml
    with:
      tool: ${{ matrix.tool }}

  build_remaining:
    name: Complete ${{ matrix.tool }} bundle
    needs: [authorize, build_changed]
    if: >-
      ${{ always() && !cancelled() && needs.authorize.result == 'success' &&
          (needs.build_changed.result == 'success' ||
           (needs.authorize.outputs.has_changed == 'false' && needs.build_changed.result == 'skipped')) &&
          needs.authorize.outputs.has_remaining == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.authorize.outputs.remaining_matrix) }}
    uses: ./.github/workflows/build-pira-tool-bundle.yml
    with:
      tool: ${{ matrix.tool }}

  test-windows:
    name: Test native Windows behavior
    needs: [authorize, build_changed]
    if: >-
      ${{ always() && !cancelled() && needs.authorize.result == 'success' &&
          (needs.build_changed.result == 'success' ||
           (needs.authorize.outputs.has_changed == 'false' && needs.build_changed.result == 'skipped')) }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run native Windows tests
        env:
          BUILD_TOOLS: ${{ needs.authorize.outputs.build_tools }}
          RETAINED_TOOLS: ${{ needs.authorize.outputs.retained_tools }}
        run: |
          python -m unittest `
            assets.scripts.test_setup_pira `
            assets.scripts.test_setup_pira_tools `
            assets.scripts.test_setup_pira_communication `
            assets.scripts.test_setup_pira_claude `
            assets.scripts.test_python_bootstrap `
            tools.dev.pira_write_check.test_benchmark `
            assets.scripts.test_retire_pira_audio `
            tools.build.test_build_pira_ctx_platform_bins `
            tools.build.test_package_github_release `
            tools.build.test_mixed_release `
            tools.build.test_release_plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RETAINED_TOOLS -eq '{}') {
            cargo test --manifest-path tools/Cargo.toml --workspace --locked -- --test-threads=1
          } else {
            $tools = @(ConvertFrom-Json $env:BUILD_TOOLS)
            if ($tools.Count -eq 0) { throw 'No fresh tool packages selected' }
            $packages = @()
            foreach ($tool in $tools) { $packages += @('--package', $tool) }
            cargo test --manifest-path tools/Cargo.toml --locked @packages -- --test-threads=1
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    name: Publish GitHub Release
    needs: [authorize, build_changed, build_remaining, test-windows]
    if: >-
      ${{ always() && !cancelled() && needs.authorize.result == 'success' &&
          (needs.build_changed.result == 'success' ||
           (needs.authorize.outputs.has_changed == 'false' && needs.build_changed.result == 'skipped')) &&
          (needs.build_remaining.result == 'success' ||
           (needs.authorize.outputs.has_remaining == 'false' && needs.build_remaining.result == 'skipped')) &&
          needs.test-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release packaging code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-bundle"
          path: ${{ runner.temp }}/pira-build-artifacts

      - name: Prepare compressed release assets
        id: release
        shell: bash
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/pira-build-artifacts
          ASSETS_DIR: ${{ runner.temp }}/pira-release-assets
          RETAINED_TOOLS: ${{ needs.authorize.outputs.retained_tools }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="pira-tools-r${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          python3 -c 'import os; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "retained-tools.json").write_text(os.environ["RETAINED_TOOLS"])'
          python3 tools/build/package_github_release.py \
            --artifacts-dir "${ARTIFACTS_DIR}" \
            --output-dir "${ASSETS_DIR}" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${tag}" \
            --source-sha "${GITHUB_SHA}" \
            --build-run-id "${GITHUB_RUN_ID}" \
            --retained-manifest "${RUNNER_TEMP}/retained-tools.json"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Prepare immutable-versioned draft or approved public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSETS_DIR: ${{ runner.temp }}/pira-release-assets
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            draft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
            [[ "${draft}" == "true" ]] || {
              echo "Refusing to replace existing published release ${TAG}." >&2
              exit 1
            }
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title "PIRA tools ${TAG#pira-tools-}" \
              --notes "Complete PIRA tools assembled at ${GITHUB_SHA}. The schema-2 index records each tool build_source_sha; retained tools are byte-for-byte copies with authenticated release and asset origins. This assembly source is not a claim that every tool was rebuilt."
          fi
          gh release upload "${TAG}" "${ASSETS_DIR}"/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          if [[ "${PUBLISH_RELEASE}" == "true" ]]; then
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --latest
          else
            echo "Draft retained: ${TAG}; public publication requires acceptance approval."
          fi
