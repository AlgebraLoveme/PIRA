[package]
name = "pira_team"
version = "0.8.2"
edition = "2024"
rust-version = "1.89"
description = "Retained Codex and Claude Code workers for PIRA"
license = "Apache-2.0"
repository = "https://github.com/AlgebraLoveme/PIRA"

[dependencies]
serde_json = "1"
sha2 = "0.11"
rusqlite = { version = "0.42", default-features = false, features = ["bundled", "hooks", "limits"] }
toml = { version = "1.2", default-features = false, features = ["parse", "display", "serde"] }
getrandom = "0.3"
csv = "1.4"
jsonschema = { version = "0.33", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
path = "../../src/pira_team/lib.rs"

[[bin]]
name = "pira_team"
path = "../../src/pira_team/main.rs"
