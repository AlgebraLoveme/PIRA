[package]
name = "pira_team"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Retained Codex workers for PIRA, coding by default"
license = "Apache-2.0"
repository = "https://github.com/AlgebraLoveme/PIRA"

[dependencies]
serde_json = "1"
getrandom = "0.3"
csv = "1.4"
jsonschema = { version = "0.33", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
path = "../../src/pira_team/lib.rs"

[[bin]]
name = "pira_team"
path = "../../src/pira_team/main.rs"
