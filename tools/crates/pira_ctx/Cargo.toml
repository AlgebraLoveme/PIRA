[package]
name = "pira_ctx"
version = "1.1.0"
edition = "2024"
rust-version = "1.89"
description = "Lightweight command-output capture, synopsis, and retrieval for PIRA agents"
license = "Apache-2.0"
repository = "https://github.com/AlgebraLoveme/PIRA"

[dependencies]
regex = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[lib]
path = "../../src/pira_ctx/lib.rs"

[[bin]]
name = "pira_ctx"
path = "../../src/pira_ctx/main.rs"
