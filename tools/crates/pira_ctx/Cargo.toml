[package]
name = "pira_ctx"
version = "1.7.0"
edition = "2024"
rust-version = "1.89"
description = "Lightweight command-output capture, synopsis, and retrieval for PIRA agents"
license = "Apache-2.0"
repository = "https://github.com/AlgebraLoveme/PIRA"

[dependencies]
regex = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
lz4_flex = { version = "0.14", default-features = false, features = ["std"] }
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lib]
path = "../../src/pira_ctx/lib.rs"

[[bin]]
name = "pira_ctx"
path = "../../src/pira_ctx/main.rs"
