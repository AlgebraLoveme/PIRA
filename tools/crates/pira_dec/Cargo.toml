[package]
name = "pira_dec"
version = "0.8.1"
edition = "2024"
rust-version = "1.89"
description = "Structured medium-level decision memory for PIRA agents"
license = "Apache-2.0"
repository = "https://github.com/AlgebraLoveme/PIRA"

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[lib]
path = "../../src/pira_dec/lib.rs"

[[bin]]
name = "pira_dec"
path = "../../src/pira_dec/main.rs"
