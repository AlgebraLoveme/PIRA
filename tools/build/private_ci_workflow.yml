name: Private PIRA snapshot tests
on: [push]
permissions:
  contents: read
jobs:
  test:
    if: github.event.repository.private == true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        crate: @TEST_TOOLS@
@TEST_EXTRA@
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@@CHECKOUT@
        with:
          persist-credentials: false
      - name: Verify snapshot hashes
        shell: bash
        run: sha256sum --check SOURCE_SHA256SUMS
      - name: Toolchain prerequisites
        shell: bash
        run: |
          rustc --version
          cargo --version
          python --version
          git --version
      - name: Task-local Linux font inventory
        if: matrix.os == 'ubuntu-latest' && matrix.crate == 'pira_svg_check'
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pira-fonts'
          root.mkdir()
          subprocess.run(['apt-get', 'download', 'fonts-dejavu-core'], cwd=root, check=True)
          packages = list(root.glob('fonts-dejavu-core_*.deb'))
          if len(packages) != 1:
              raise SystemExit('Expected one downloaded font package')
          subprocess.run(['dpkg-deb', '--extract', str(packages[0]), str(root / 'unpacked')], check=True)
          fonts = root / 'unpacked/usr/share/fonts/truetype/dejavu'
          if not list(fonts.glob('*.ttf')):
              raise SystemExit('Missing extracted DejaVu fonts')
          fixture = pathlib.Path('tools/crates/pira_svg_check/tests/fixtures/linux-dejavu-fonts.conf')
          config = root / 'fonts.conf'
          from xml.sax.saxutils import escape
          config.write_text(fixture.read_text().replace('/usr/share/fonts/truetype/dejavu', escape(str(fonts))))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('FONTCONFIG_FILE=' + str(config) + chr(10))
          PY
      - name: Locked crate tests
        run: cargo test --locked --no-fail-fast --manifest-path tools/Cargo.toml -p ${{ matrix.crate }}
      - name: Native writing checker parity and release tests
        if: matrix.crate == 'pira_write_check'
        shell: bash
        run: |
          cargo fmt --manifest-path tools/Cargo.toml -p pira_write_check -- --check
          cargo build --locked --manifest-path tools/Cargo.toml -p pira_write_check
          cargo test --locked --release --manifest-path tools/Cargo.toml -p pira_write_check
          cargo build --locked --release --manifest-path tools/Cargo.toml -p pira_write_check
          python -B - <<'PY_CHECKER'
          import os, pathlib, subprocess, sys
          name = 'pira_write_check.exe' if sys.platform == 'win32' else 'pira_write_check'
          for profile in ('debug', 'release'):
              binary = (pathlib.Path('tools/target') / profile / name).resolve(strict=True)
              subprocess.run([
                  sys.executable, '-B', '-m', 'unittest', 'discover',
                  '-s', 'tools/crates/pira_write_check/tests', '-p', 'test_cli_parity.py', '-v',
              ], env=dict(os.environ, PIRA_WRITE_CHECK_BIN=str(binary)), check=True)
          PY_CHECKER
      - name: Required Windows native Team checks
        if: matrix.os == 'windows-latest' && matrix.crate == 'pira_team'
        shell: bash
        run: |
          python -B - <<'PY_NATIVE'
          import json, os, pathlib, re, shutil, subprocess, sys, tempfile
          sys.path.insert(0, str(pathlib.Path('tools/build').resolve()))
          import private_ci
          binary = private_ci.provision_codex(pathlib.Path(os.environ['RUNNER_TEMP']) / 'pira-team-native-codex')
          # Keep the pinned package and siblings intact; expose its entrypoint on task-local PATH.
          shutil.copyfile(binary, binary.with_name('codex.exe'))
          build = subprocess.run([
              'cargo', 'test', '--locked', '--manifest-path', 'tools/Cargo.toml',
              '-p', 'pira_team', '--lib', '--no-run', '--message-format=json',
          ], check=True, stdout=subprocess.PIPE, text=True, encoding='utf-8')
          executables = [item['executable'] for line in build.stdout.splitlines()
                         if (item := json.loads(line)).get('reason') == 'compiler-artifact'
                         and item.get('profile', {}).get('test') and item.get('executable')]
          if len(executables) != 1:
              raise SystemExit('Expected exactly one Team library test executable')
          required = {
              'backend::tests::installed_native_schema_supports_team_requests',
              'tests::installed_native_launcher_preserves_exact_untrusted_project_keys',
          }
          with tempfile.TemporaryDirectory(prefix='pira-team-native-', dir=os.environ['RUNNER_TEMP']) as home:
              environment = {key: value for key, value in os.environ.items()
                             if key.upper() in {'PATH', 'SYSTEMROOT', 'WINDIR', 'COMSPEC', 'PATHEXT'}}
              environment.update(HOME=home, USERPROFILE=home, LOCALAPPDATA=home,
                                 CODEX_HOME=home, TMP=home, TEMP=home, TMPDIR=home,
                                 PYTHONDONTWRITEBYTECODE='1')
              environment['PATH'] = str(binary.parent) + os.pathsep + environment.get('PATH', '')
              subprocess.run([str(binary), '--version'], check=True, env=environment)
              result = subprocess.run([
                  executables[0], 'installed_native_', '--ignored', '--nocapture',
                  '--test-threads=1', '--format=pretty', '--color=never',
              ], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
                  encoding='utf-8', env=environment, timeout=180)
              print(result.stdout, end='', flush=True)
              result.check_returncode()
              outcomes = re.findall(r'^test (.+?) \.\.\. (.+)$', result.stdout, re.MULTILINE)
              if (len(outcomes) != len(required)
                      or {name for name, status in outcomes if status == 'ok'} != required):
                  raise SystemExit('Required Windows native checks missing, skipped or unsuccessful')
          PY_NATIVE
      - name: Build fake-backend test binary (Linux only)
        if: matrix.os == 'ubuntu-latest' && matrix.crate == 'pira_team'
        run: cargo build --locked --manifest-path tools/Cargo.toml -p pira_team -p pira_dec
      - name: Fake-backend contracts (no model calls; POSIX fixture)
        if: matrix.os == 'ubuntu-latest' && matrix.crate == 'pira_team'
        shell: bash
        run: PIRA_TEAM_BIN="$GITHUB_WORKSPACE/tools/target/debug/pira_team" PIRA_DEC_BIN="$GITHUB_WORKSPACE/tools/target/debug/pira_dec" TEAM_TEST_SLOW_PREFLIGHT=1 python -B -m unittest discover -s tools/crates/pira_team/tests -p 'test_*.py' -v
  setup:
    if: github.event.repository.private == true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@@CHECKOUT@
        with:
          persist-credentials: false
      - name: Verify snapshot hashes
        shell: bash
        run: sha256sum --check SOURCE_SHA256SUMS
      - name: Build source Ctx for required native migration regression
        run: cargo build --locked --manifest-path tools/Cargo.toml --target-dir tools/target -p pira_ctx
      - name: Native synthetic setup and store tests (no login or installation)
        shell: bash
        run: |
          python -B - <<'PY'
          import os, pathlib, sys, tempfile, unittest
          if sys.version_info < (3, 11):
              raise SystemExit('Setup tests require Python 3.11+')
          ctx_binary = (pathlib.Path('tools/target/debug') /
                        ('pira_ctx.exe' if sys.platform == 'win32' else 'pira_ctx')).resolve(strict=True)
          if not ctx_binary.is_file():
              raise SystemExit('Required source-built Ctx executable missing')
          required_test = 'test_migrate_pira_stores.MigrationTests.test_native_ctx_event_merge_and_post_use_rerun'
          class RequiredNativeResult(unittest.TextTestResult):
              native_succeeded = False
              def addSuccess(self, test):
                  super().addSuccess(test)
                  if test.id() == required_test:
                      self.native_succeeded = True
          with tempfile.TemporaryDirectory(prefix='pira-setup-ci-') as temporary:
              # Retain only OS execution necessities, never runner auth/config values.
              environment = {key: value for key, value in os.environ.items()
                             if key.upper() in {'PATH', 'SYSTEMROOT', 'WINDIR', 'COMSPEC', 'PATHEXT'}}
              os.environ.clear()
              os.environ.update(environment, HOME=temporary, USERPROFILE=temporary,
                                LOCALAPPDATA=temporary, TMP=temporary, TEMP=temporary,
                                TMPDIR=temporary, SHELL='/bin/sh',
                                PIRA_TEST_CTX_BINARY=str(ctx_binary))
              tempfile.tempdir = temporary  # Initial TemporaryDirectory populated the old cache.
              # Registry behavior must use explicit test doubles, not the runner's HKCU.
              sys.modules['winreg'] = None
              sys.path.insert(0, str(pathlib.Path('assets/scripts').resolve()))
              suite = unittest.defaultTestLoader.discover('assets/scripts', pattern='test_*.py')
              result = unittest.TextTestRunner(verbosity=2, resultclass=RequiredNativeResult).run(suite)
              if not result.native_succeeded:
                  raise SystemExit('Required native Ctx migration regression did not execute successfully: ' + required_test)
              if not result.testsRun:
                  raise SystemExit('No staged setup tests discovered')
              if not result.wasSuccessful():
                  raise SystemExit(1)
          PY
  native_relocation:
    if: github.event.repository.private == true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@@CHECKOUT@
        with:
          persist-credentials: false
      - name: Verify snapshot hashes
        shell: bash
        run: sha256sum --check SOURCE_SHA256SUMS
      - name: Provision hash-pinned Codex 0.161.0 in runner-local storage
        shell: bash
        run: python -B tools/build/private_ci.py provision-codex --directory "$RUNNER_TEMP/pira-relocation-codex"
      - name: Required deterministic and native completed-turn relocation validation
        shell: bash
        run: |
          binary="$RUNNER_TEMP/pira-relocation-codex/codex"
          if [ "$RUNNER_OS" = "Windows" ]; then binary="$RUNNER_TEMP/pira-relocation-codex/codex-x86_64-pc-windows-msvc.exe"; fi
          python -B tools/build/private_ci.py native-relocation --directory "$RUNNER_TEMP/pira-relocation-evidence" --binary "$binary"
